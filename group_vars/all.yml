---
# Holds the GitHub token once filled in. Do not commit it back (see README.md).

# Public DNS name of the workshop. Here it only drives the nginx virtual host.
# The administrator puts the same name into .env as PUBLIC_HOSTNAME and passes
# it to certbot. Its A record must point at the instance's static IP.
workshop_domain: workshop.example.org

# GitHub access token for BLGHT/hacklu-workshop (fine-grained, read-only
# "Contents"). The repository is private, so this is required.
workshop_git_token: ""
